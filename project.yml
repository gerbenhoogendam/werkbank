# Xcode-project voor Werkbank (macOS + iOS). Genereren met XcodeGen:
#   brew install xcodegen && xcodegen generate && open Werkbank.xcodeproj
name: Werkbank
options:
  bundleIdPrefix: com.example      # alleen een terugval; het echte bundle-id komt uit Config/Base.xcconfig
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
# Bundle-id (APP_BUNDLE_ID) en Team (DEVELOPMENT_TEAM) komen uit Config/Base.xcconfig, dat een eigen,
# niet-gecommit Config/Local.xcconfig inleest. Zo blijven ze staan bij elke `xcodegen generate`.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  WerkbankCore:
    path: WerkbankCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0

# Beide schema's expliciet, zodat Werkbank-iOS altijd in het schemamenu van Xcode staat.
schemes:
  Werkbank-macOS:
    build:
      targets:
        Werkbank-macOS: all
    run:
      config: Debug
    archive:
      config: Release
  Werkbank-iOS:
    build:
      targets:
        Werkbank-iOS: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  Werkbank-macOS:
    type: application
    platform: macOS
    sources:
      - Shared
      - macOS
    dependencies:
      - package: WerkbankCore
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_NAME: Werkbank
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ICLOUD"
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_FILE: macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: macOS/Werkbank.entitlements
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Werkbank
        LSApplicationCategoryType: public.app-category.productivity
        # Alleen standaardversleuteling (HTTPS): vrijgesteld; voorkomt de exportvraag bij elke TestFlight-upload.
        ITSAppUsesNonEncryptionExempt: true
        NSCalendarsFullAccessUsageDescription: Werkbank toont je agenda naast het board en plant to-do's in als afspraak.
        NSCalendarsUsageDescription: Werkbank toont je agenda naast het board en plant to-do's in als afspraak.
        GoogleClientID: $(GOOGLE_CLIENT_ID)
        # Type van de mail die uit het Gmail-paneel naar het board wordt gesleept.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: nl.itgwerkbank.gmail-message
            UTTypeDescription: Gmail-bericht (Werkbank)
            UTTypeConformsTo:
              - public.data
    entitlements:
      path: macOS/Werkbank.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.aps-environment: development

  Werkbank-iOS:
    type: application
    platform: iOS
    sources:
      - Shared
      - iOS
    dependencies:
      - package: WerkbankCore
    settings:
      base:
        PRODUCT_NAME: Werkbank
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ICLOUD"
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/Werkbank.entitlements
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Werkbank
        NSCalendarsFullAccessUsageDescription: Werkbank toont je agenda en plant to-do's in als afspraak.
        NSCalendarsUsageDescription: Werkbank toont je agenda en plant to-do's in als afspraak.
        # Types van een kaart en een kolom die op het board worden gesleept.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: nl.itgwerkbank.card
            UTTypeDescription: Kaart (Werkbank)
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: nl.itgwerkbank.column
            UTTypeDescription: Kolom (Werkbank)
            UTTypeConformsTo:
              - public.data
        ITSAppUsesNonEncryptionExempt: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: iOS/Werkbank.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
