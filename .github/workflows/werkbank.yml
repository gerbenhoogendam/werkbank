name: Werkbank

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "claude/**"]

# Zelfde Xcode als op de Mac van de eigenaar (`xcodebuild -version`), zodat CI dezelfde compilerfouten ziet.
# De runner `xcode-27` heeft /Applications/Xcode_<versie>.app voor 27.0, 27.1 en 27.2.
env:
  XCODE_VERSION: "27.1"

jobs:
  core-tests:
    name: WerkbankCore tests
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Xcode kiezen
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app" && xcodebuild -version
      - name: swift test
        working-directory: WerkbankCore
        run: swift test

  build:
    name: Build ${{ matrix.scheme }}
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: Werkbank-macOS
            destination: "platform=macOS"
          - scheme: Werkbank-iOS
            destination: "generic/platform=iOS Simulator"
    steps:
      - uses: actions/checkout@v4
      - name: Xcode kiezen
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app" && xcodebuild -version
      - name: Metal-toolchain
        if: matrix.scheme == 'Werkbank-macOS'
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: XcodeGen installeren
        run: brew install xcodegen
      - name: Project genereren
        run: xcodegen generate
      - name: Bouwen
        run: |
          set -o pipefail
          xcodebuild build \
            -project Werkbank.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log
      - name: App inpakken
        run: |
          mkdir -p dist
          APP=$(find build/DerivedData/Build/Products -maxdepth 2 -name Werkbank.app | head -1)
          ditto -c -k --keepParent "$APP" "dist/${{ matrix.scheme }}.app.zip"
      - name: Screenshot van de gestarte macOS-app (best effort)
        if: matrix.scheme == 'Werkbank-macOS'
        continue-on-error: true
        run: |
          APP=$(find build/DerivedData/Build/Products -maxdepth 2 -name Werkbank.app | head -1)
          open "$APP"
          sleep 12
          screencapture -x dist/macos-screenshot.png
          pkill Werkbank || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scheme }}
          path: dist/
          if-no-files-found: warn
      - name: Fouten samenvatten
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -100 || true
          # Ook als annotatie, zodat de fouten zonder het volledige log te lezen zijn.
          grep -E ": error:" build.log | sed -E 's#^.*/(Werkbank|werkbank)/##' | sort -u | head -30 | while IFS= read -r line; do
            echo "::error::${line}"
          done
